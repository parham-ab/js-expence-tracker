<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link href="./assets/styles/output.css" rel="stylesheet" />
    <title>Ledger — Expense Tracker</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="material-symbols-outlined brand-icon"
            >account_balance_wallet</span
          >
          <div>
            <h1>Ledger</h1>
            <p>Track every dollar, in and out.</p>
          </div>
        </div>
      </header>

      <main class="layout">
        <!-- balance card -->
        <section class="balance-card">
          <div class="balance-head">
            <span class="material-symbols-outlined balance-icon">payments</span>
            <div>
              <p class="balance-label">Current balance</p>
              <p class="balance-display">$ 0.00</p>
            </div>
          </div>

          <div class="stat-row">
            <div class="stat-pill stat-pill--income">
              <span class="material-symbols-outlined">trending_up</span>
              <div>
                <p>Income</p>
                <span class="income-display">$ 0.00</span>
              </div>
            </div>
            <div class="stat-pill stat-pill--expense">
              <span class="material-symbols-outlined">trending_down</span>
              <div>
                <p>Expenses</p>
                <span class="expense-display">$ 0.00</span>
              </div>
            </div>
          </div>

          <div class="section-divider">
            <span>By category</span>
          </div>
          <div class="percentage"></div>

          <div class="section-divider">
            <span>New entry</span>
          </div>

          <form class="entry-form" onsubmit="return false;">
            <div class="field">
              <label for="type">Type</label>
              <select name="type" id="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select name="category" id="category">
                <option value="Shopping">Shopping</option>
                <option value="Transportation">Transportation</option>
                <option value="Food">Food</option>
                <option value="Bills">Bills</option>
                <option value="Investment">Investment</option>
                <option value="healthcare">Healthcare</option>
                <option value="others">Others</option>
              </select>
            </div>

            <div class="field">
              <label for="date">Date</label>
              <input type="date" name="date" id="date" />
            </div>

            <div class="field">
              <label for="name">Name</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Coffee, rent, salary…"
              />
            </div>

            <div class="field">
              <label for="amount">Amount</label>
              <input
                type="number"
                name="amount"
                id="amount"
                placeholder="0.00"
              />
            </div>

            <button class="add-button" id="addButton" type="button">
              <span class="material-symbols-outlined">add</span>
              Add entry
            </button>
          </form>
        </section>

        <!-- table -->
        <section class="table-card" id="table-container">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col" class="table-initial-info col-no">No</th>
                  <th scope="col" class="table-initial-info col-name">Name</th>
                  <th scope="col" class="table-initial-info col-amount">
                    Amount
                  </th>
                  <th scope="col" class="table-initial-info col-date">Date</th>
                  <th scope="col" class="table-initial-info col-category">
                    Category
                  </th>
                  <th scope="col" class="table-initial-info col-actions">
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="scripts/script.js"></script>
  </body>
</html>
